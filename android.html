<!DOCTYPE html>
<html lang="en">
<head>
    <!-- memoyad.com/android: a short, readable address for the Google Play listing (Play itself only
         offers the package-name URL). Sends the visitor straight to the store; the link below is the
         fallback when the redirect is blocked. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Memoyad on Google Play</title>
    <meta http-equiv="refresh" content="0; url={{ site.play_url }}&utm_source=memoyad.com&utm_medium=shortlink">
    <link rel="canonical" href="{{ site.play_url }}">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1B1B21; background: #FAFAFF; margin: 0; padding: 20vh 20px; text-align: center; }
        a { color: #3A3FC4; }
    </style>
</head>
<body>
    <p>Taking you to Memoyad on Google Play&hellip;</p>
    <p><a href="{{ site.play_url }}&utm_source=memoyad.com&utm_medium=shortlink">Open Google Play</a></p>
    <script>location.replace("{{ site.play_url }}&utm_source=memoyad.com&utm_medium=shortlink");</script>
</body>
</html>
